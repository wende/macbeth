name: Deploy webpage

on:
  push:
    branches: [main]
    paths: ["webpage/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webpage/package-lock.json

      - run: npm ci
        working-directory: webpage

      - run: npm run build
        working-directory: webpage

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webpage/dist

      - id: deployment
        uses: actions/deploy-pages@v4
