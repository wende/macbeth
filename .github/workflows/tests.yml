name: Tests

on:
  push:
  pull_request:

jobs:
  client:
    name: Client Tests
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm --workspace client test

      - name: Run AI review state tests
        run: node --test .github/scripts/ai-review-state.test.mjs

  daemon:
    name: Daemon Tests
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The macos-14 image's default Xcode is 15.4 which ships Swift 5.10,
      # but daemon/Package.swift declares swift-tools-version: 6.0.
      # Xcode 16.2 is also pre-installed on macos-14 and ships Swift 6.0.
      # Select it before running swift test so the matching toolchain
      # is on PATH.
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Verify Swift toolchain
        run: swift --version

      - name: Run Swift tests
        working-directory: daemon
        run: swift test
