name: Tests

on:
  push:
  pull_request:

jobs:
  client:
    name: Client Tests
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm --workspace client test

  daemon:
    name: Daemon Tests
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The macos-14 image ships with Swift 5.10.x, but daemon/Package.swift
      # declares swift-tools-version: 6.0. Install the matching toolchain
      # via the official swift-actions action before running swift test.
      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.0"

      - name: Run Swift tests
        working-directory: daemon
        run: swift test
