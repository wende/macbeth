name: MiniMax PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

# A newer push supersedes any in-flight review for the same pull request.
concurrency:
  group: minimax-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  minimax-review:
    name: MiniMax Review
    # The script checks the PR's live state. Unlike a job-level event condition,
    # this lets a rerun of an old draft event review a PR after it becomes ready.
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch manually selected PR head
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "PR number must contain digits only." >&2
            exit 1
          }
          git fetch --no-tags origin "pull/${PR_NUMBER}/head"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Review with MiniMax
        run: node .github/scripts/ai-review.mjs
        env:
          PROVIDER_NAME: MiniMax
          API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # These optional repository variables allow a private gateway or a
          # different MiniMax model without changing the workflow.
          API_BASE: ${{ vars.MINIMAX_BASE_URL || 'https://api.minimax.io/v1' }}
          MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M3' }}
          MAX_TOKENS: '16000'
          REASONING_SPLIT: 'true'
          STRUCTURED_OUTPUT: 'true'
          SYSTEM_PROMPT_FILE: .github/prompts/minimax-pr-review.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          ACTION: ${{ github.event.action || 'workflow_dispatch' }}
          BEFORE_SHA: ${{ github.event.before }}
