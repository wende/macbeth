  </defs>

  <rect width="1280" height="640" fill="#F8F7FA"/>
  <circle cx="112" cy="560" r="250" fill="#8B3342" opacity="0.045"/>
  <circle cx="820" cy="42" r="210" fill="#61202F" opacity="0.04"/>
