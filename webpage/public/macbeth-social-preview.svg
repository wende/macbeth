      <stop offset="1" stop-color="#32111A"/>
    </linearGradient>
    <linearGradient id="cursor" x1="28" y1="18" x2="87" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C47A88"/>
      <stop offset="0.5" stop-color="#8B3342"/>
      <stop offset="1" stop-color="#61202F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#090612" flood-opacity="0.28"/>
