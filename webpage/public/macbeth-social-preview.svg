  </text>

  <text x="76" y="396" fill="#61202F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="700" letter-spacing="-0.45">Open-source Computer Use for macOS</text>

