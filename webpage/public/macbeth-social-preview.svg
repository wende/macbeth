    <text x="66" y="37" fill="#61202F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="800" letter-spacing="8">MACBETH</text>
  </g>

  <text x="76" y="226" fill="#1A1520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="53" font-weight="800" letter-spacing="-1.8">
