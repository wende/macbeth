<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Macbeth — Open-source Computer Use for macOS</title>
  <desc id="desc">Give the agent you already use hands and eyes on your Mac.</desc>

  <defs>
    <linearGradient id="panel" x1="880" y1="30" x2="1260" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B3342"/>
