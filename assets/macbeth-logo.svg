<svg xmlns="http://www.w3.org/2000/svg" width="520" height="128" viewBox="0 0 520 128" fill="none">
  <title>Macbeth automation pointer wordmark</title>
  <desc>A sharp burgundy mouse pointer beside the lowercase word macbeth.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#090612" flood-opacity=".35"/>
    </filter>
    <linearGradient id="cursor" x1="28" y1="18" x2="87" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B3342"/>
      <stop offset=".5" stop-color="#61202F"/>
      <stop offset="1" stop-color="#32111A"/>
    </linearGradient>
  </defs>

  <!-- Pointer: broad silhouette remains legible at 16–24 px -->
  <path d="M18 13.5v82.2c0 4.1 5 6.1 7.8 3.1L44 79.4l13.1 28.1c1.1 2.4 4 3.4 6.4 2.3l12.2-5.7c2.4-1.1 3.4-4 2.3-6.4L65.2 70.2h25.5c4.2 0 6.2-5.3 2.9-7.9L25.4 9.9c-3-2.3-7.4-.2-7.4 3.6Z" fill="url(#cursor)" stroke="#F8F7FA" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Macbeth's dagger-shaped inner cut -->
  <path d="m30 28 43 33H54.9l15.8 34-7.1 3.3-16-34.4-17.6 19V28Z" fill="#F4F1F8" fill-opacity=".09"/>

  <!-- Wordmark shares the pointer's burgundy body, pale edge, and shadow -->
  <text x="140" y="84" fill="#61202F" stroke="#F8F7FA" stroke-width="4" paint-order="stroke fill" stroke-linejoin="round" filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-3.5">macbeth</text>

</svg>
